name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.3'
      - uses: julia-actions/cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Instantiate Julia environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Julia target, transition and CLI checks
        run: julia --project=. test/runtests.jl
      - name: Python interface checks
        run: python3 -m unittest discover -s test -p 'test_*.py'
      - name: R interface checks
        run: Rscript test/test_wrappers.R
      - name: Real Julia, Python and R smoke runs
        run: python3 test/integration_smoke.py
